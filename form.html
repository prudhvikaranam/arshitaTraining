<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Form</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <div class="main-container main-block" id="main-container">

        <div class="body-container" id="body-container">
            
            <div class="left-container" id="left-container">
                <img src="./assets/hero-image.png" class="hero-image" />
                <h1 class="hero-title">Explore the things you love.</h1>
            </div>


            <div class="center-container" id="center-container">
                <img src="./assets/background.jpg" class="background-image" />
            </div>



            <div class="right-container" id="right-container">
                <h1 class="hero-title">Log in to Facebook</h1>
                <input type="text" placeholder="Email or phone number" />
                <input type="text" placeholder="Password" />
                <button class="login-button">Log In</button>
            </div>
        </div>







    </div>
</body>

</html>
