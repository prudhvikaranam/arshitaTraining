<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Layout Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Container for all sections */
    .container {
      display: flex;
      flex-direction: column; /* Stack sections vertically */
      gap: 20px;
      padding: 20px;
    }

    /* Banner section */
    .container .header {
        display: flex;
        background-color: aqua;
        padding: 20px;
        text-align: center;
        font-size: 1.5em;
        flex-direction: row;
    }
    .banner {
      background: #f4f4f4;
      padding: 20px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
    }


    /* Deals section with multiple items side by side */
    .deals {
      display: flex;
      justify-content: space-between; /* Spread items evenly */
      gap: 15px;
    }

    .deal-item {
      flex: 1; /* Each item takes equal space */
      background: #e8f0fe;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
    }

    .deal-item h3 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top banner -->
     <div class = header">
   <div class="deal-X">
    <h4>Search Results</h4>
   </div>
   <div class="deal-X">
    <h4>Login</h4>
    </div>
    <div class="deal-X">
        <h4>Register</h4>
    </div>
    <div class="banner">
      🎧 Up to 70% off | Deals on Headphones
    </div>

    <!-- Deals section -->
    <div class="deals">
      <div class="deal-item">
        <h3>Appliances for your home</h3>
        <p>Up to 55% off</p>
      </div>
      <div class="deal-item">
        <h3>Home essentials</h3>
        <p>Starting ₹49</p>
      </div>
      <div class="deal-item">
        <h3>Headphones</h3>
        <p>Up to 75% off</p>
      </div>
    </div>
  </div>
</body>
</html>
